<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breaksy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">Breaksy</h1>
      <p class="tagline">Healthy breaks for your eyes</p>
    </header>

    <!-- Reminder Type Selector -->
    <div class="control-group control-group-selector">
      <label class="label" for="reminder-type-select">Reminder</label>
      <select id="reminder-type-select" class="select select-reminder">
        <option value="eye">👀 Eye Break</option>
        <option value="water">💧 Water</option>
      </select>
    </div>

    <!-- Status Card -->
    <div class="status-card" id="status-card">
      <div id="status-text" class="status-text">
        <span id="status-label" class="status-label"></span>
        <span id="status-time" class="status-time">--:--</span>
      </div>
      <div id="status-subtext" class="status-subtext"></div>
    </div>

    <!-- Interval Control -->
    <div class="controls">
      <div class="control-group">
        <label class="label" for="interval-select">Interval</label>
        <div class="input-row">
          <select id="interval-select" class="select">
            <option value="20">20 min</option>
            <option value="30">30 min</option>
            <option value="45">45 min</option>
            <option value="60">60 min</option>
            <option value="90">90 min</option>
            <option value="120">120 min</option>
            <option value="custom">Custom...</option>
          </select>
          <input type="number" id="interval-custom" class="input input-number hidden" min="5" max="240" value="20">
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="buttons">
      <button id="btn-trigger" class="btn btn-primary">Take Break Now</button>
      <button id="btn-snooze" class="btn btn-secondary">Snooze</button>
      <button id="btn-pause" class="btn btn-secondary">Pause</button>
    </div>

    <!-- Status Indicators -->
    <div class="status-indicators" id="status-indicators">
      <div class="indicator" id="indicator-eye" data-type="eye">
        <span class="indicator-icon">👀</span>
        <span class="indicator-label">Eye</span>
        <span class="indicator-status" id="status-eye">--:--</span>
      </div>
      <div class="indicator" id="indicator-water" data-type="water">
        <span class="indicator-icon">💧</span>
        <span class="indicator-label">Water</span>
        <span class="indicator-status" id="status-water">--:--</span>
      </div>
    </div>

    <footer class="footer">
      <a href="#" id="link-settings" class="link">Settings</a>
    </footer>
  </div>
  <script type="module" src="popup.ts"></script>
</body>
</html>
