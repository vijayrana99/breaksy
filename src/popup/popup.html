<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breaksy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Segmented Control -->
    <div class="segmented-control" id="segmented-control">
      <button class="segment active" data-type="eye" id="segment-eye">
        <span class="segment-icon">👀</span>
        <span class="segment-label">Eye</span>
      </button>
      <button class="segment" data-type="water" id="segment-water">
        <span class="segment-icon">💧</span>
        <span class="segment-label">Water</span>
      </button>
    </div>

    <!-- Counters Display -->
    <div class="counters-container">
      <div class="counter-item" id="counter-eye">
        <div class="counter-header">
          <span class="counter-icon">👀</span>
          <span class="counter-label">Eye Break</span>
        </div>
        <div class="counter-time" id="counter-eye-time">Next in: --:-- min</div>
        <div class="counter-status" id="counter-eye-status">Disabled</div>
      </div>
      <div class="counter-divider"></div>
      <div class="counter-item" id="counter-water">
        <div class="counter-header">
          <span class="counter-icon">💧</span>
          <span class="counter-label">Water Reminder</span>
        </div>
        <div class="counter-time" id="counter-water-time">Next in: --:-- min</div>
        <div class="counter-status" id="counter-water-status">Disabled</div>
      </div>
    </div>

    <!-- Primary Action -->
    <button id="btn-trigger" class="btn btn-primary">Take Break Now</button>

    <!-- Secondary Actions -->
    <div class="secondary-actions">
      <button id="btn-snooze" class="btn btn-secondary">Snooze 5 min</button>
      <button id="btn-pause" class="btn btn-secondary">Pause</button>
    </div>

    <!-- Interval Selector -->
    <div class="interval-row">
      <span class="interval-label">Interval:</span>
      <select id="interval-select" class="select select-interval">
        <option value="20">20 min</option>
        <option value="30">30 min</option>
        <option value="45">45 min</option>
        <option value="60">60 min</option>
        <option value="90">90 min</option>
        <option value="120">120 min</option>
        <option value="custom">Custom...</option>
      </select>
      <input type="number" id="interval-custom" class="input input-number hidden" min="5" max="240" value="20">
    </div>

    <!-- Footer -->
    <footer class="footer">
      <a href="#" id="link-settings" class="link">Settings</a>
      <span class="privacy-note">🔒 No data leaves your device</span>
    </footer>
  </div>
  <script type="module" src="popup.ts"></script>
</body>
</html>
